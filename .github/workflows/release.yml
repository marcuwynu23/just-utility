name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup LLVM/clang
        uses: egor-tensin/setup-clang@v2
        with:
          version: 18
          platform: x64

      - name: Build all binaries
        run: make clean && make all

      - name: Run tests
        run: tests\run.ps1
        shell: pwsh

      - name: Create archive
        run: |
          New-Item -ItemType Directory -Path staging\dist
          Copy-Item dist\*.exe staging\dist\
          Copy-Item LICENSE staging\
          Copy-Item README.md staging\
          Copy-Item USER-GUIDE.md staging\
          Compress-Archive -Path staging\* -DestinationPath just-utility-${{ github.ref_name }}.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Just Utility ${{ github.ref_name }}
          body: |
            ## Just Utility ${{ github.ref_name }}

            See [USER-GUIDE.md](https://github.com/${{ github.repository }}/blob/main/USER-GUIDE.md) for full documentation.

            ### Installation

            1. Download `just-utility-${{ github.ref_name }}.zip`
            2. Extract to a folder (e.g., `C:\tools\just-utility`)
            3. Add the folder to your PATH:
               ```
               setx PATH "%PATH%;C:\tools\just-utility\dist"
               ```
            4. Run `justutil` to see available commands
          files: just-utility-${{ github.ref_name }}.zip
