<h1>jvi — Java interpreter (compile + run)</h1>
<h2>Synopsis</h2>
<pre>jvi [--help | -h] [sourcefile]</pre>
<h2>Description</h2>
<p>Compiles and runs a Java source file in one step. Compiled with <code>javac</code>, executed with <code>java</code>, then <code>.class</code> files are cleaned up.</p>
<h2>Dependencies</h2>
<p>javac, java (JDK)</p>
<h2>Examples</h2>
<pre>jvi Hello
jvi --help</pre>
