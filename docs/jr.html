<h1>jr — Run JAR files</h1>
<h2>Synopsis</h2>
<pre>jr [--help | -h] [file-name] [args]</pre>
<h2>Description</h2>
<p>Runs a JAR file from <code>C:/jar/</code> directory. The <code>.jar</code> extension is appended automatically.</p>
<h2>Dependencies</h2>
<p>java (JRE)</p>
<h2>Examples</h2>
<pre>jr myapp
jr myapp --verbose</pre>
